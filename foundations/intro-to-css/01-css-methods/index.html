<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods for Adding CSS</title>
    <!-- External CSS -->
     <link rel="stylesheet" href="styles.css"

      <!-- Internal CSS -->
      <style>
        p{
          background-color: green;
          color: white;
          font-size: 18px;
        }
      </style>
  </head>
  <body>
    <!-- Inline CSS-->
    <div style="background-color: red; color: white; font-size: 32px; text-align: center; font-weight: bold;">
      Style me via inline styling!
      </div>

    <p>I should be styled via the internal method!</p>
    <button>Style me via the external method!</button>
  </body>
</html>
